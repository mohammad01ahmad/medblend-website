name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - uses: actions/checkout@v4

      # 2. Setup the node environment and enable fast caching
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      # 3. Install the dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run the linter for syntax and formatting errors
      # - name: Run linter
      #  run: npm run lint

      # 5. Build the project to catch build errors
      - name: Build
        run: npm run build
